; Charger display: Waveshare ESP32-S3-Touch-AMOLED-1.64 (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM)
; Shows Cerbo GX (MQTT) and Huawei R48xx (CAN) data. Style guide: Victron GUI v2 (ref/gui-v2).
[platformio]
default_envs = d1
extra_configs = secrets.ini

[env:amoled164]
; pioarduino 54.03.21 = Arduino-ESP32 core 3.2.1 on ESP-IDF 5.4 (esp_lcd QSPI API). Newer pioarduino releases
; (55.x) need PlatformIO core >= 6.2; the installed core is 6.1.19 (stock espressif32 6.9 = core 2.0.17, too old).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_port = COM11
monitor_port = COM11
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -Iinclude
lib_deps =
    lvgl/lvgl@8.4.0
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.2

; Over-the-air upload: same build, pushed over WLAN (device must run an OTA-capable firmware).
; Host/password live in the git-ignored secrets.ini. Windows firewall must let python.exe accept
; the device's incoming connection on the private network profile.
[env:amoled164_ota]
extends = env:amoled164
upload_protocol = espota
upload_port = ${ota.host}
upload_flags =
    --auth=${ota.password}
    --timeout=30

; Firmware upload over HTTP to the board's own update endpoint (PC connects outbound -> no firewall
; exception needed). Needs curl on the PATH (Windows 10+ ships it).
[env:amoled164_http]
extends = env:amoled164
upload_protocol = custom
upload_command = curl -s -S --max-time 120 -u ota:${ota.password} -F "firmware=@$SOURCE" http://${ota.host}/update

; ---- per device: d1 = display at charger "Huawei 2" (unit 1 board, COM11), d2 = display at "Huawei 1"
[env:d1]
extends = env:amoled164
build_flags = ${env:amoled164.build_flags} -DDISPLAY_ID=1
upload_port = COM11

[env:d2]
extends = env:amoled164
build_flags = ${env:amoled164.build_flags} -DDISPLAY_ID=2
upload_port = ${ota.port2}

[env:d1_http]
extends = env:d1
upload_protocol = custom
upload_command = curl -s -S --max-time 120 -u ota:${ota.password} -F "firmware=@$SOURCE" http://${ota.host}/update

[env:d2_http]
extends = env:d2
upload_protocol = custom
upload_command = curl -s -S --max-time 120 -u ota:${ota.password} -F "firmware=@$SOURCE" http://${ota.host2}/update
