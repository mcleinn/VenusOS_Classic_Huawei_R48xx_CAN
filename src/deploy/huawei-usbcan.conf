# /etc/modprobe.d/huawei-usbcan.conf  (installed and guarded by /data/huawei/boot.sh)
#
# The USB CAN adapter of the Huawei display boards (CANable 2.5, two channels, kernel driver
# gs_usb) must never be probed during boot. The Cerbo GX (original revision) names its built-in
# CAN ports by probe order and by name only: "can0" is the VE.Can port (SoC controller
# 1c2bc00.can) and "can1" is the BMS-Can port, created by attaching ttyS3 with slcand *as can1*.
# On 2026-11-03 the adapter was attached during a reboot, gs_usb probed before the SoC
# controller, its channels took can0/can1, the BMS-Can attach failed (name taken) and Venus
# ran the Pylontech BMS service on the USB adapter: battery gone, MPPT error 67.
#
# With this blacklist udev's automatic module load (alias usb:v1D50p606F...) is refused; the
# huawei-charger service loads gs_usb explicitly (modprobe gs_usb) only after it has verified
# that can0 is 1c2bc00.can and can1 exists, so the adapter's channels always land on can2/can3.
blacklist gs_usb
